    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

\n/* cyrillic */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"aba3d3cf-5eed-4dda-833a-89b2842db619\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7a5710b1-3e64-42dd-95b4-aa5f88bb1581\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ff42ecc4-ef98-490c-977e-cc8b657e20f7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"36a7a2b3-60a2-4b3d-aa79-571ac07d40bb\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #FAF7F2; -webkit-font-smoothing: antialiased; }\n  a { color: #1B2D45; }\n  a:hover { color: #3ABBE0; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background:#FAF7F2;color:#1B2D45;font-family:Lato,Helvetica,sans-serif;overflow-x:hidden\">\n\n  <section data-screen-label=\"Capa\" style=\"background:#1B2D45;color:#FAF7F2;padding:0\">\n    <div style=\"max-width:700px;margin:0 auto;padding:44px 24px 64px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;paddingBottom:22px;border-bottom:1px solid rgba(250,247,242,0.22)\">\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#3ABBE0\">Programa<\u002Fspan>\n        <span style=\"font-size:10px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:rgba(250,247,242,0.6)\">São Paulo · Rio · Online<\u002Fspan>\n      <\u002Fdiv>\n\n      <h1 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(88px,32vw,190px);line-height:0.86;letter-spacing:-0.03em;margin:28px 0 0;color:#FAF7F2\">CORE<span style=\"color:#F4A332\">.<\u002Fspan><\u002Fh1>\n\n      <p style=\"font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(24px,6.4vw,34px);line-height:1.28;letter-spacing:-0.01em;margin:26px 0 0;color:#FAF7F2;text-wrap:pretty\">Os seus gatilhos são seus. O tratamento também precisa ser.<\u002Fp>\n\n      <div style=\"width:56px;height:3px;background:#3ABBE0;margin:34px 0 26px\"><\u002Fdiv>\n\n      <p style=\"font-size:clamp(16px,4.3vw,18px);line-height:1.68;margin:0 0 18px;color:rgba(250,247,242,0.88);text-wrap:pretty\">A enxaqueca não se resolve em um encontro isolado. Durante 75 dias, você registra as suas crises no portal e eu leio esses registros ao longo da semana, ajustando a conduta assim que um padrão aparece.<\u002Fp>\n      <p style=\"font-size:clamp(16px,4.3vw,18px);line-height:1.68;margin:0;color:rgba(250,247,242,0.88);text-wrap:pretty\">A nutrição caminha junto com o seu neurologista, sem substituí-lo.<\u002Fp>\n\n      <div style=\"display:inline-flex;align-items:center;gap:10px;margin:34px 0 0;padding:11px 18px;border:1px solid rgba(58,187,224,0.55);border-radius:999px\">\n        <span style=\"width:7px;height:7px;border-radius:999px;background:#F4A332\"><\u002Fspan>\n        <span style=\"font-size:13px;font-weight:700;letter-spacing:0.06em;color:#FAF7F2\">4 sessões ao longo de 75 dias<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:52px;padding-top:26px;border-top:1px solid rgba(250,247,242,0.22);display:flex;flex-direction:column;gap:4px\">\n        <span style=\"font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:600;color:#FAF7F2\">Jacqueline Hochberg<\u002Fspan>\n        <span style=\"font-size:14px;color:rgba(250,247,242,0.72)\">Nutricionista CRN-3 60917<\u002Fspan>\n        <span style=\"font-size:14px;color:rgba(250,247,242,0.72);text-wrap:pretty\">Especializada em tratamento de pacientes com enxaqueca<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"O ponto de partida\" style=\"max-width:700px;margin:0 auto;padding:64px 24px 12px\">\n    <div style=\"width:28px;height:2px;background:#F4A332;margin-bottom:14px\"><\u002Fdiv>\n    <span style=\"font-size:11px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:rgba(27,45,69,0.6)\">O ponto de partida<\u002Fspan>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(28px,7.4vw,42px);line-height:1.15;letter-spacing:-0.02em;margin:16px 0 24px;text-wrap:pretty\">Uma lista de alimentos proibidos não funciona<\u002Fh2>\n    <p style=\"font-size:clamp(17px,4.4vw,18px);line-height:1.7;margin:0 0 18px;color:rgba(27,45,69,0.85);text-wrap:pretty\">Se você já recebeu listas de alimentos para cortar e as crises continuam, não é por falta de esforço. A enxaqueca tem origens genéticas variadas, e duas pessoas com o mesmo diagnóstico costumam responder a coisas diferentes. Por isso a lista pronta funciona para poucas e deixa a maioria com medo de comer.<\u002Fp>\n    <p style=\"font-size:clamp(17px,4.4vw,18px);line-height:1.7;margin:0;color:rgba(27,45,69,0.85);text-wrap:pretty\">O que ajuda é investigar, ao longo das semanas, o que de fato antecede as suas crises: alimentação, jejum, sono, hidratação e estresse. É esse trabalho de observação orientada que o programa organiza.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Para quem é\" style=\"max-width:700px;margin:0 auto;padding:56px 24px 12px\">\n    <div style=\"width:28px;height:2px;background:#F4A332;margin-bottom:14px\"><\u002Fdiv>\n    <span style=\"font-size:11px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:rgba(27,45,69,0.6)\">Para quem é<\u002Fspan>\n    <p style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(24px,6.2vw,34px);line-height:1.2;letter-spacing:-0.02em;margin:16px 0 30px;text-wrap:pretty\">O CORE foi desenhado para você, se<\u002Fp>\n    <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0\">\n      <li style=\"display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:18px 0;border-top:1px solid rgba(27,45,69,0.14)\">\n        <sc-if value=\"{{ numerada }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:600;color:#3ABBE0;line-height:1.4\">01<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ marcadores }}\"><span style=\"width:8px;height:8px;background:#3ABBE0;margin-top:11px\"><\u002Fspan><\u002Fsc-if>\n        <span style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.62;color:rgba(27,45,69,0.85);text-wrap:pretty\">já cortou tantos alimentos que não sabe mais o que comer, e as crises continuam vindo;<\u002Fspan>\n      <\u002Fli>\n      <li style=\"display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:18px 0;border-top:1px solid rgba(27,45,69,0.14)\">\n        <sc-if value=\"{{ numerada }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:600;color:#3ABBE0;line-height:1.4\">02<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ marcadores }}\"><span style=\"width:8px;height:8px;background:#3ABBE0;margin-top:11px\"><\u002Fspan><\u002Fsc-if>\n        <span style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.62;color:rgba(27,45,69,0.85);text-wrap:pretty\">faz tratamento com neurologista, a medicação ajuda, e ainda assim falta cuidar do que acontece fora do consultório;<\u002Fspan>\n      <\u002Fli>\n      <li style=\"display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:18px 0;border-top:1px solid rgba(27,45,69,0.14)\">\n        <sc-if value=\"{{ numerada }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:600;color:#3ABBE0;line-height:1.4\">03<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ marcadores }}\"><span style=\"width:8px;height:8px;background:#3ABBE0;margin-top:11px\"><\u002Fspan><\u002Fsc-if>\n        <span style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.62;color:rgba(27,45,69,0.85);text-wrap:pretty\">recebeu uma lista de gatilhos genérica que nunca bateu com a sua experiência real;<\u002Fspan>\n      <\u002Fli>\n      <li style=\"display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:18px 0;border-top:1px solid rgba(27,45,69,0.14)\">\n        <sc-if value=\"{{ numerada }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:600;color:#3ABBE0;line-height:1.4\">04<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ marcadores }}\"><span style=\"width:8px;height:8px;background:#3ABBE0;margin-top:11px\"><\u002Fspan><\u002Fsc-if>\n        <span style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.62;color:rgba(27,45,69,0.85);text-wrap:pretty\">desconfia que sono ruim, refeições atrasadas e semanas tensas pesam nas suas crises, sem conseguir demonstrar isso;<\u002Fspan>\n      <\u002Fli>\n      <li style=\"display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:18px 0;border-top:1px solid rgba(27,45,69,0.14)\">\n        <sc-if value=\"{{ numerada }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:600;color:#3ABBE0;line-height:1.4\">05<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ marcadores }}\"><span style=\"width:8px;height:8px;background:#3ABBE0;margin-top:11px\"><\u002Fspan><\u002Fsc-if>\n        <span style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.62;color:rgba(27,45,69,0.85);text-wrap:pretty\">usa medicação de resgate mais vezes por mês do que gostaria;<\u002Fspan>\n      <\u002Fli>\n      <li style=\"display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:18px 0;border-top:1px solid rgba(27,45,69,0.14);border-bottom:1px solid rgba(27,45,69,0.14)\">\n        <sc-if value=\"{{ numerada }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:600;color:#3ABBE0;line-height:1.4\">06<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ marcadores }}\"><span style=\"width:8px;height:8px;background:#3ABBE0;margin-top:11px\"><\u002Fspan><\u002Fsc-if>\n        <span style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.62;color:rgba(27,45,69,0.85);text-wrap:pretty\">quer entender o seu caso com método, em lugar de seguir descobrindo por tentativa e erro.<\u002Fspan>\n      <\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Como funciona\" style=\"max-width:700px;margin:0 auto;padding:56px 24px 12px\">\n    <div style=\"width:28px;height:2px;background:#F4A332;margin-bottom:14px\"><\u002Fdiv>\n    <span style=\"font-size:11px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:rgba(27,45,69,0.6)\">Como funciona<\u002Fspan>\n    <p style=\"font-size:clamp(17px,4.4vw,18px);line-height:1.7;margin:20px 0 18px;color:rgba(27,45,69,0.85);text-wrap:pretty\">São quatro sessões distribuídas ao longo de 75 dias: a primeira no dia do início, e as seguintes aos 15, aos 45 e aos 75 dias. Cada uma começa pela leitura do que os seus registros mostraram desde a sessão anterior.<\u002Fp>\n    <div style=\"display:flex;gap:6px;margin:0 0 22px\">\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:8px\"><div style=\"height:4px;background:#3ABBE0\"><\u002Fdiv><span style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;color:rgba(27,45,69,0.6)\">DIA 0<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:8px\"><div style=\"height:4px;background:#3ABBE0\"><\u002Fdiv><span style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;color:rgba(27,45,69,0.6)\">DIA 15<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:2;display:flex;flex-direction:column;gap:8px\"><div style=\"height:4px;background:#3ABBE0\"><\u002Fdiv><span style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;color:rgba(27,45,69,0.6)\">DIA 45<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:2;display:flex;flex-direction:column;gap:8px\"><div style=\"height:4px;background:#F4A332\"><\u002Fdiv><span style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;color:rgba(27,45,69,0.6)\">DIA 75<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:clamp(17px,4.4vw,18px);line-height:1.7;margin:0;color:rgba(27,45,69,0.85);text-wrap:pretty\">A avaliação da composição corporal acompanha todo o programa nas duas modalidades: por bioimpedância no consultório, e por protocolo de medidas validado no atendimento online, com dados igualmente confiáveis para conduzir o plano.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-screen-label=\"A diferença do programa\" style=\"max-width:700px;margin:0 auto;padding:56px 24px 12px\">\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(30px,8vw,46px);line-height:1.1;letter-spacing:-0.025em;margin:0 0 8px;text-wrap:pretty\">A diferença do programa<\u002Fh2>\n    <div style=\"width:100%;height:1px;background:rgba(27,45,69,0.18);margin:26px 0 0\"><\u002Fdiv>\n\n    <article style=\"padding:30px 0;border-bottom:1px solid rgba(27,45,69,0.14)\">\n      <h3 style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#1B2D45;margin:0 0 14px\">Seu diário no portal<\u002Fh3>\n      <p style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.66;margin:0 0 14px;color:rgba(27,45,69,0.85);text-wrap:pretty\">Você registra o dia a dia: o que comeu e em que horários, como dormiu, quanto bebeu de água, como estava o estresse. Quando a crise vem, entram também a intensidade da dor e a medicação usada.<\u002Fp>\n      <p style=\"font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(18px,4.8vw,21px);line-height:1.4;margin:0;color:#1B2D45;text-wrap:pretty\">É o que transforma a sua experiência em informação clínica.<\u002Fp>\n    <\u002Farticle>\n\n    <article style=\"padding:30px 0;border-bottom:1px solid rgba(27,45,69,0.14)\">\n      <h3 style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#1B2D45;margin:0 0 14px\">O que acontece entre as sessões<\u002Fh3>\n      <p style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.66;margin:0 0 14px;color:rgba(27,45,69,0.85);text-wrap:pretty\">Os seus registros são lidos ao longo da semana, e não apenas na véspera da próxima consulta. Quando um padrão aparece, como três crises depois de noites curtas ou dor sempre no intervalo longo entre refeições, a conduta muda naquele momento.<\u002Fp>\n      <p style=\"font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(18px,4.8vw,21px);line-height:1.4;margin:0;color:#1B2D45;text-wrap:pretty\">São 75 dias de plano vivo, acompanhando o que está acontecendo com você agora.<\u002Fp>\n    <\u002Farticle>\n\n    <article style=\"padding:30px 0;border-bottom:1px solid rgba(27,45,69,0.14)\">\n      <h3 style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#1B2D45;margin:0 0 14px\">Individualizado de verdade<\u002Fh3>\n      <p style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.66;margin:0 0 14px;color:rgba(27,45,69,0.85);text-wrap:pretty\">Nada aqui sai de modelo pronto. O plano nasce dos seus horários, do que você come de verdade, do seu trabalho, do seu ciclo e do que os seus registros revelam.<\u002Fp>\n      <p style=\"font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(18px,4.8vw,21px);line-height:1.4;margin:0;color:#1B2D45;text-wrap:pretty\">Duas pacientes com o mesmo diagnóstico terminam o programa com planos diferentes.<\u002Fp>\n    <\u002Farticle>\n\n    <article style=\"padding:30px 0;border-bottom:1px solid rgba(27,45,69,0.14)\">\n      <h3 style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#1B2D45;margin:0 0 14px\">Gatilhos e moduladores<\u002Fh3>\n      <p style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.66;margin:0 0 14px;color:rgba(27,45,69,0.85);text-wrap:pretty\">Os seus gatilhos são investigados um a um, sem lista proibitiva pronta. Um alimento só entra na sua lista quando o padrão se repete e a suspeita se confirma.<\u002Fp>\n      <p style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.66;margin:0;color:rgba(27,45,69,0.85);text-wrap:pretty\">Junto com eles são mapeados os moduladores da dor: sono, jejum, hidratação e estresse, que muitas vezes pesam mais do que a comida.<\u002Fp>\n    <\u002Farticle>\n\n    <article style=\"padding:30px 0;border-bottom:1px solid rgba(27,45,69,0.14)\">\n      <h3 style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#1B2D45;margin:0 0 14px\">Evolução medida<\u002Fh3>\n      <p style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.66;margin:0;color:rgba(27,45,69,0.85);text-wrap:pretty\">O impacto da enxaqueca é medido no início e no fim pelo HIT-6, questionário validado internacionalmente, para você acompanhar o progresso pelo dado.<\u002Fp>\n    <\u002Farticle>\n\n    <article style=\"padding:30px 0 0\">\n      <h3 style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#F4A332;margin:0 0 14px\">O seu playbook<\u002Fh3>\n      <p style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.66;margin:0 0 14px;color:rgba(27,45,69,0.85);text-wrap:pretty\">No encerramento você recebe um documento com o seu nome, escrito a partir do seu caso: a linha do tempo das crises nos 75 dias, os gatilhos confirmados e os que foram descartados, os moduladores que funcionaram para você, o plano alimentar de manutenção e o que fazer nas situações de risco, como viagem, noite mal dormida ou período pré-menstrual.<\u002Fp>\n      <p style=\"font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(18px,4.8vw,21px);line-height:1.4;margin:0;color:#1B2D45;text-wrap:pretty\">É o que fica com você depois que o programa termina.<\u002Fp>\n    <\u002Farticle>\n  <\u002Fsection>\n\n  <section data-screen-label=\"O que a ciência sustenta\" style=\"max-width:700px;margin:0 auto;padding:56px 24px 12px\">\n    <div style=\"background:#FFFFFF;border:1px solid rgba(27,45,69,0.14);padding:32px 24px\">\n      <div style=\"width:28px;height:2px;background:#3ABBE0;margin-bottom:14px\"><\u002Fdiv>\n      <span style=\"font-size:11px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:rgba(27,45,69,0.6)\">O que a ciência sustenta<\u002Fspan>\n      <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(24px,6.2vw,34px);line-height:1.18;letter-spacing:-0.02em;margin:16px 0 20px;text-wrap:pretty\">Investigar os seus padrões é mais importante que cortar alimentos aleatoriamente<\u002Fh2>\n      <p style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.68;margin:0;color:rgba(27,45,69,0.85);text-wrap:pretty\">Na enxaqueca, a regularidade das refeições, a hidratação e o cuidado com o sono estão associados à redução da carga de crises, enquanto dietas de eliminação ampla não têm respaldo como conduta de rotina. Um gatilho alimentar só se confirma quando o padrão se repete, e é isso que o diário revela ao longo do tempo.<\u002Fp>\n      <sc-if value=\"{{ notas }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"font-size:12px;line-height:1.6;margin:22px 0 0;padding-top:18px;border-top:1px solid rgba(27,45,69,0.14);color:rgba(27,45,69,0.6);text-wrap:pretty\">Síntese de recomendações da nutrição clínica e da neurologia; as referências podem ser solicitadas. A nutrição atua como adjuvante ao tratamento do seu neurologista.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"O que o CORE não é\" style=\"max-width:700px;margin:0 auto;padding:56px 24px 12px\">\n    <span style=\"font-size:10px;font-weight:700;letter-spacing:0.24em;text-transform:uppercase;color:#3ABBE0\">Antes de decidir<\u002Fspan>\n    <div style=\"width:28px;height:2px;background:#F4A332;margin:16px 0 14px\"><\u002Fdiv>\n    <span style=\"font-size:11px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:rgba(27,45,69,0.6)\">Para não haver dúvida<\u002Fspan>\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(30px,8vw,44px);line-height:1.12;letter-spacing:-0.025em;margin:16px 0 26px;text-wrap:pretty\">O que o CORE não é<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:0\">\n      <p style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.66;margin:0;padding:20px 0;border-top:1px solid rgba(27,45,69,0.14);color:rgba(27,45,69,0.85);text-wrap:pretty\">Não é uma lista de proibições. Os seus gatilhos são investigados um a um, para manter a alimentação o mais ampla possível.<\u002Fp>\n      <p style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.66;margin:0;padding:20px 0;border-top:1px solid rgba(27,45,69,0.14);color:rgba(27,45,69,0.85);text-wrap:pretty\">Não substitui o seu neurologista. Caminha junto com ele, inclusive vigiando o uso excessivo de medicação de resgate, que pode piorar a dor.<\u002Fp>\n      <p style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.66;margin:0;padding:20px 0;border-top:1px solid rgba(27,45,69,0.14);border-bottom:1px solid rgba(27,45,69,0.14);color:rgba(27,45,69,0.85);text-wrap:pretty\">Nenhum programa nutricional pode garantir o fim das crises. O que se busca aqui é a redução da frequência e do impacto delas na sua rotina.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Perguntas frequentes\" style=\"max-width:700px;margin:0 auto;padding:56px 24px 12px\">\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(30px,8vw,44px);line-height:1.12;letter-spacing:-0.025em;margin:0 0 26px;text-wrap:pretty\">Perguntas frequentes<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:0\">\n      <div style=\"padding:24px 0;border-top:1px solid rgba(27,45,69,0.14)\">\n        <h3 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(19px,5vw,22px);line-height:1.3;margin:0 0 10px;color:#1B2D45;text-wrap:pretty\">É uma dieta restritiva?<\u002Fh3>\n        <p style=\"font-size:clamp(16px,4.2vw,17px);line-height:1.66;margin:0;color:rgba(27,45,69,0.82);text-wrap:pretty\">Não. O CORE evita listas proibitivas e trabalha para manter a sua alimentação variada enquanto os gatilhos são investigados.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:24px 0;border-top:1px solid rgba(27,45,69,0.14)\">\n        <h3 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(19px,5vw,22px);line-height:1.3;margin:0 0 10px;color:#1B2D45;text-wrap:pretty\">Presencial ou online?<\u002Fh3>\n        <p style=\"font-size:clamp(16px,4.2vw,17px);line-height:1.66;margin:0;color:rgba(27,45,69,0.82);text-wrap:pretty\">Os dois têm a mesma qualidade clínica. O atendimento presencial acontece em São Paulo, na Av. Paulista e na Av. Brigadeiro Faria Lima, e no Rio de Janeiro, em Botafogo. No online, a composição corporal é avaliada por protocolo de medidas validado, que sustenta a conduta com a mesma segurança.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:24px 0;border-top:1px solid rgba(27,45,69,0.14)\">\n        <h3 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(19px,5vw,22px);line-height:1.3;margin:0 0 10px;color:#1B2D45;text-wrap:pretty\">Quanto tempo até eu sentir diferença?<\u002Fh3>\n        <p style=\"font-size:clamp(16px,4.2vw,17px);line-height:1.66;margin:0;color:rgba(27,45,69,0.82);text-wrap:pretty\">Varia de pessoa para pessoa. O impacto é medido pelo HIT-6 no início e no fim, para você acompanhar a evolução pelo dado, e não pela lembrança.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:24px 0;border-top:1px solid rgba(27,45,69,0.14)\">\n        <h3 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(19px,5vw,22px);line-height:1.3;margin:0 0 10px;color:#1B2D45;text-wrap:pretty\">Vou precisar parar meus remédios?<\u002Fh3>\n        <p style=\"font-size:clamp(16px,4.2vw,17px);line-height:1.66;margin:0;color:rgba(27,45,69,0.82);text-wrap:pretty\">Não. A nutrição é adjuvante, e a sua medicação segue com o neurologista. O programa ainda ajuda a vigiar o uso excessivo de resgate, que pode cronificar a dor.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding:24px 0;border-top:1px solid rgba(27,45,69,0.14);border-bottom:1px solid rgba(27,45,69,0.14)\">\n        <h3 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(19px,5vw,22px);line-height:1.3;margin:0 0 10px;color:#1B2D45;text-wrap:pretty\">E se eu quiser começar aos poucos?<\u002Fh3>\n        <p style=\"font-size:clamp(16px,4.2vw,17px);line-height:1.66;margin:0;color:rgba(27,45,69,0.82);text-wrap:pretty\">É para isso que existe a consulta única. Você conhece o método, recebe as primeiras orientações e decide depois, com o valor aproveitado no programa se a migração acontecer no prazo.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Investimento\" style=\"background:#1B2D45;color:#FAF7F2;margin-top:56px\">\n    <div style=\"max-width:700px;margin:0 auto;padding:60px 24px\">\n      <div style=\"width:28px;height:2px;background:#F4A332;margin-bottom:14px\"><\u002Fdiv>\n      <span style=\"font-size:11px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:#3ABBE0\">Investimento<\u002Fspan>\n      <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(30px,8vw,46px);line-height:1.12;letter-spacing:-0.025em;margin:16px 0 32px;color:#FAF7F2;text-wrap:pretty\">Dois caminhos possíveis<\u002Fh2>\n\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"background:rgba(250,247,242,0.06);border:1px solid rgba(58,187,224,0.45);padding:28px 22px\">\n          <span style=\"font-size:10px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:#3ABBE0\">Acompanhamento completo<\u002Fspan>\n          <h3 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(26px,6.6vw,34px);line-height:1.15;margin:12px 0 4px;color:#FAF7F2\">Programa CORE<\u002Fh3>\n          <p style=\"font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(40px,11vw,58px);line-height:1;letter-spacing:-0.02em;margin:16px 0 12px;color:#F4A332\">R$ 2.700<\u002Fp>\n          <p style=\"font-size:13px;line-height:1.6;margin:0 0 22px;color:rgba(250,247,242,0.68);text-wrap:pretty\">À vista sem encargos. No cartão, o parcelamento tem encargos por conta do paciente.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <span style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;padding:8px 13px;border:1px solid rgba(250,247,242,0.28);color:rgba(250,247,242,0.9)\">4 sessões<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;padding:8px 13px;border:1px solid rgba(250,247,242,0.28);color:rgba(250,247,242,0.9)\">Portal com diário<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;padding:8px 13px;border:1px solid rgba(250,247,242,0.28);color:rgba(250,247,242,0.9)\">75 dias de acompanhamento<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;padding:8px 13px;border:1px solid rgba(250,247,242,0.28);color:rgba(250,247,242,0.9)\">HIT-6 no início e no fim<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;padding:8px 13px;border:1px solid rgba(250,247,242,0.28);color:rgba(250,247,242,0.9)\">Playbook final<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid rgba(250,247,242,0.22);padding:28px 22px\">\n          <span style=\"font-size:10px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:rgba(250,247,242,0.6)\">Para conhecer o método<\u002Fspan>\n          <h3 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(24px,6vw,30px);line-height:1.15;margin:12px 0 4px;color:#FAF7F2\">Consulta única<\u002Fh3>\n          <p style=\"font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(32px,8.4vw,44px);line-height:1;letter-spacing:-0.02em;margin:14px 0 12px;color:#FAF7F2\">R$ 650<\u002Fp>\n          <p style=\"font-size:clamp(15px,4vw,16px);line-height:1.66;margin:0;color:rgba(250,247,242,0.82);text-wrap:pretty\">Um encontro, aplicação do HIT-6, 14 dias de registro no diário e uma orientação escrita com os primeiros ajustes. O acompanhamento contínuo, o Playbook e as demais sessões são exclusivos do programa.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Migração\" style=\"max-width:700px;margin:0 auto;padding:60px 24px 12px\">\n    <h2 style=\"font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(26px,6.8vw,38px);line-height:1.14;letter-spacing:-0.02em;margin:0 0 14px;text-wrap:pretty\">Começou pela consulta única e quer seguir?<\u002Fh2>\n    <p style=\"font-size:clamp(16px,4.3vw,17px);line-height:1.68;margin:0 0 26px;color:rgba(27,45,69,0.85);text-wrap:pretty\">O valor pago é descontado do programa. Funciona assim:<\u002Fp>\n\n    <ol style=\"list-style:none;margin:0 0 26px;padding:0;display:flex;flex-direction:column;gap:0\">\n      <li style=\"display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;padding:18px 0;border-top:1px solid rgba(27,45,69,0.14)\">\n        <span style=\"font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:600;color:#3ABBE0;line-height:1.45\">1<\u002Fspan>\n        <span style=\"font-size:clamp(16px,4.2vw,17px);line-height:1.62;color:rgba(27,45,69,0.85);text-wrap:pretty\">Você faz a consulta única e registra o diário por 14 dias.<\u002Fspan>\n      <\u002Fli>\n      <li style=\"display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;padding:18px 0;border-top:1px solid rgba(27,45,69,0.14)\">\n        <span style=\"font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:600;color:#3ABBE0;line-height:1.45\">2<\u002Fspan>\n        <span style=\"font-size:clamp(16px,4.2vw,17px);line-height:1.62;color:rgba(27,45,69,0.85);text-wrap:pretty\">Ao fim desse período, recebe a orientação escrita final.<\u002Fspan>\n      <\u002Fli>\n      <li style=\"display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;padding:18px 0;border-top:1px solid rgba(27,45,69,0.14)\">\n        <span style=\"font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:600;color:#3ABBE0;line-height:1.45\">3<\u002Fspan>\n        <span style=\"font-size:clamp(16px,4.2vw,17px);line-height:1.62;color:rgba(27,45,69,0.85);text-wrap:pretty\">A partir dessa entrega, você tem 7 dias para decidir migrar.<\u002Fspan>\n      <\u002Fli>\n      <li style=\"display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;padding:18px 0;border-top:1px solid rgba(27,45,69,0.14);border-bottom:1px solid rgba(27,45,69,0.14)\">\n        <span style=\"font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:600;color:#F4A332;line-height:1.45\">4<\u002Fspan>\n        <span style=\"font-size:clamp(16px,4.2vw,17px);line-height:1.62;color:rgba(27,45,69,0.85);text-wrap:pretty\">Migrando dentro do prazo, os R$ 650 entram como parte do pagamento: restam R$ 2.050, e a consulta que você já fez conta como o Dia 0 do programa.<\u002Fspan>\n      <\u002Fli>\n    <\u002Fol>\n\n    <p style=\"font-size:clamp(15px,4vw,16px);line-height:1.66;margin:0;color:rgba(27,45,69,0.72);text-wrap:pretty\">Passados os 7 dias sem a migração, o programa passa a ser contratado pelo valor integral.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Como começar\" style=\"max-width:700px;margin:0 auto;padding:48px 24px 72px\">\n    <div style=\"background:#FFFFFF;border-top:3px solid #F4A332;border-right:1px solid rgba(27,45,69,0.14);border-bottom:1px solid rgba(27,45,69,0.14);border-left:1px solid rgba(27,45,69,0.14);padding:32px 24px\">\n      <p style=\"font-size:clamp(16px,4.3vw,18px);line-height:1.7;margin:0 0 16px;color:rgba(27,45,69,0.88);text-wrap:pretty\"><strong style=\"font-weight:900;letter-spacing:0.02em\">Como começar:<\u002Fstrong> tudo parte da primeira consulta, em que avalio o seu caso e indico o caminho clinicamente adequado. Se você já sabe que quer o acompanhamento completo, entramos direto no programa. Se preferir conhecer o método antes, começamos pela consulta única.<\u002Fp>\n      <p style=\"font-family:'Playfair Display',Georgia,serif;font-size:clamp(19px,5.2vw,24px);line-height:1.36;margin:0;color:#1B2D45;text-wrap:pretty\">Para agendar, é só me responder por aqui com a sua preferência de formato e os melhores dias da semana.<\u002Fp>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ notas }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"font-size:12px;line-height:1.62;margin:34px 0 0;color:rgba(27,45,69,0.6);text-wrap:pretty\">A nutrição no CORE é adjuvante ao tratamento do seu neurologista. O trabalho é de redução da frequência das crises e do impacto delas na sua rotina, sem promessa de cura. Este documento foi preparado a seu pedido e traz as condições vigentes na data do envio.<\u002Fp>\n    <\u002Fsc-if>\n\n    <div style=\"margin-top:34px;padding-top:24px;border-top:1px solid rgba(27,45,69,0.18);display:flex;flex-direction:column;gap:5px\">\n      <span style=\"font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:600;color:#1B2D45\">Jacqueline Hochberg<\u002Fspan>\n      <span style=\"font-size:13px;color:rgba(27,45,69,0.66);text-wrap:pretty\">Nutricionista CRN-3 60917 · São Paulo, Rio de Janeiro e online<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;listaNumerada&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Listas&quot;},&quot;notasLegais&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Conteúdo&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const numerada = this.props.listaNumerada ?? true;\n    return {\n      numerada,\n      marcadores: !numerada,\n      notas: this.props.notasLegais ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
